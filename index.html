<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <title>For Farnaz ✨</title>

  <!-- Elegant fonts (loaded from Google Fonts; works fine on GitHub Pages) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #eaf4ff;
      --bg: #05060a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Cormorant Garamond", Georgia, serif;
    }
    #scene { position: fixed; inset: 0; display: block; }

    /* ---------- Start screen ---------- */
    #start {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(26px, 6vh, 54px);
      background: radial-gradient(130% 90% at 50% 40%, #0b1020 0%, #05060a 70%);
      text-align: center;
      transition: opacity 1.1s ease;
      padding: 24px;
    }
    #start.hide { opacity: 0; pointer-events: none; }

    .gem {
      width: clamp(66px, 16vw, 104px);
      aspect-ratio: 1 / 1;
      position: relative;
      animation: float 3.4s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255, 150, 215, .55));
    }
    .gem::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(145deg, #ffd6ee, #ff8fd0 45%, #c79bff 100%);
      clip-path: polygon(50% 0%, 85% 32%, 50% 100%, 15% 32%);
      opacity: .92;
    }
    .gem::after {
      content: "";
      position: absolute; left: 15%; right: 15%; top: 32%;
      height: 1px; background: rgba(255,255,255,.65);
    }
    @keyframes float { 0%,100%{ transform: translateY(0) rotate(0deg);} 50%{ transform: translateY(-10px) rotate(4deg);} }

    .tap {
      font-family: "Playfair Display", serif;
      font-weight: 500;
      font-size: clamp(22px, 6vw, 34px);
      letter-spacing: .02em;
      color: #f2f8ff;
    }
    .hint {
      font-size: clamp(14px, 3.6vw, 17px);
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(240, 200, 225, .62);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:.95;} }

    /* ---------- Message ---------- */
    #message {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2.6s ease;
      padding: 24px;
      background: radial-gradient(70% 60% at 50% 50%, rgba(6,4,10,.78) 0%, rgba(6,4,10,.40) 55%, rgba(6,4,10,.0) 100%);
    }
    #message.show { opacity: 1; }

    .eyebrow {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      letter-spacing: .5em;
      text-transform: uppercase;
      font-size: clamp(16px, 4.8vw, 28px);
      color: #ffd0ea;
      margin: 0 0 .35em .5em;
      transform: translateY(14px);
      opacity: 0;
      transition: all 1.4s ease .2s;
      text-shadow: 0 2px 6px rgba(0,0,0,.85), 0 0 18px rgba(255,140,205,.5);
    }
    .name {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: clamp(56px, 20vw, 170px);
      line-height: .95;
      margin: 0;
      background: linear-gradient(180deg, #ffe2f3 0%, #ff8fd0 48%, #b479ff 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1px rgba(60, 20, 55, .35);
      transform: translateY(22px);
      opacity: 0;
      transition: all 1.6s cubic-bezier(.16,1,.3,1) .5s;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,.7)) drop-shadow(0 0 28px rgba(255,130,210,.4));
    }
    .sub {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(20px, 6vw, 38px);
      color: #fdeaf5;
      margin: .55em 0 0;
      transform: translateY(16px);
      opacity: 0;
      transition: all 1.5s ease 1.1s;
      text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 22px rgba(255,150,215,.35);
    }
    #message.show .eyebrow,
    #message.show .name,
    #message.show .sub { transform: translateY(0); opacity: 1; }

    /* ---------- Replay ---------- */
    #replay {
      position: fixed; z-index: 25;
      left: 50%; bottom: clamp(26px, 7vh, 58px);
      transform: translateX(-50%);
      font-family: "Cormorant Garamond", serif;
      letter-spacing: .32em; text-transform: uppercase;
      font-size: 14px;
      color: rgba(220,235,255,.8);
      background: rgba(140, 200, 255, .07);
      border: 1px solid rgba(150, 205, 255, .35);
      border-radius: 999px;
      padding: 12px 24px;
      cursor: pointer;
      opacity: 0; pointer-events: none;
      transition: opacity 1s ease, background .3s ease;
      backdrop-filter: blur(4px);
    }
    #replay.show { opacity: 1; pointer-events: auto; }
    #replay:hover { background: rgba(150, 205, 255, .18); }

    .tap.loading { opacity: .55; }
    #browserWarn {
      display: none;
      max-width: 330px;
      font-family: "Cormorant Garamond", serif;
      font-size: 16px; line-height: 1.5;
      color: #ffdcee;
      background: rgba(120, 60, 110, .28);
      border: 1px solid rgba(255, 180, 220, .38);
      border-radius: 14px;
      padding: 13px 17px;
      margin-top: 2px;
    }

    /* subtle cinematic vignette on top of everything */
    .vignette {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      box-shadow: inset 0 0 min(28vw,220px) 10px rgba(0,0,0,.7);
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <!-- ===== EDIT YOUR WORDS HERE ===== -->
  <div id="message">
    <p class="eyebrow">Happy Birthday</p>
    <h1 class="name">Farnaz</h1>
    <p class="sub">You're a diamond in the sky&nbsp;✨</p>
  </div>

  <div id="replay">Play again</div>

  <div id="start">
    <div class="gem"></div>
    <div class="tap loading" id="tapLabel">Loading…</div>
    <div class="hint" id="tapHint">just a moment ♪</div>
    <div id="browserWarn"></div>
  </div>

  <!-- the instrumental -->
  <audio id="audio" src="Diamonds-Instrumental.m4a" preload="auto" playsinline></audio>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    /* =========================================================
       TIMELINE  —  tweak these if you want the message to land
       exactly on the song's "shine bright" swell.
       All values are seconds measured from the moment she taps.
    ========================================================= */
    const INTRO_DUR   = 15;    // length of the slow glide toward the diamond
    const REVEAL_AT   = 13.5;  // when "Happy Birthday Farnaz" starts fading in
    const REPLAY_AT   = 18.5;  // when the "play again" button appears
    const CAM_START_Z = 15;    // camera starts far away...
    const CAM_END_Z   = 4.6;   // ...and glides to here

    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    /* ---------------------------------------------------------
       QUALITY TIERS — phones get a much lighter scene so it stays
       smooth and the audio isn't starved of CPU. Desktop keeps the
       full glassy/dispersion look you approved as v3.
       The two heavy features (transmission + dispersion) are OFF on
       mobile; brighter reflections + internal glow keep it diamond-y.
    --------------------------------------------------------- */
    const Q = isMobile
      ? { dpr: 1.0, aa: false, transmission: 0.0, dispersion: 0.0, useBloom: false, bloom: 0, lights: false, clearcoat: 0.0, iridescence: 0.0, stars: 170, sparkles: 6,  envInt: 3.7, emissive: 0.95, exposure: 1.12 }
      : { dpr: 2.0, aa: true,  transmission: 0.4, dispersion: 4.0, useBloom: true,  bloom: 0.35, lights: true,  clearcoat: 1.0, iridescence: 0.25, stars: 700, sparkles: 11, envInt: 3.3, emissive: 0.65, exposure: 1.12 };

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: Q.aa, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, Q.dpr));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = Q.exposure;
    renderer.setClearColor(0x05060a, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05060a, 0.03);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.4, CAM_START_Z);

    // ---- a bright, colourful environment for the glass to reflect & refract ----
    // (pure transmission over a black sky just looks black — the gem needs light to catch)
    function makeEnvTexture() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#5a4a6e'; g.fillRect(0, 0, 1024, 512);   // bright base → the gem reflects light, not darkness
      const blobs = [
        [210, 150, 270, 'rgba(255,255,255,1.0)'],
        [700, 110, 300, 'rgba(255,180,222,0.98)'],
        [500, 360, 340, 'rgba(214,180,255,0.92)'],
        [880, 380, 240, 'rgba(255,232,246,0.92)'],
        [120, 400, 220, 'rgba(205,222,255,0.78)'],
        [360, 70, 210, 'rgba(255,255,255,0.88)'],
        [980, 230, 210, 'rgba(255,205,236,0.85)']
      ];
      for (const [x, y, r, col] of blobs) {
        const rg = g.createRadialGradient(x, y, 0, x, y, r);
        rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(90,74,110,0)');
        g.fillStyle = rg; g.fillRect(0, 0, 1024, 512);
      }
      const t = new THREE.CanvasTexture(c);
      t.mapping = THREE.EquirectangularReflectionMapping;
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromEquirectangular(makeEnvTexture()).texture;

    // soft radial-glow texture (used for the backdrop the gem refracts)
    function makeGlowTexture() {
      const c = document.createElement('canvas'); c.width = c.height = 512;
      const g = c.getContext('2d');
      const rg = g.createRadialGradient(256, 256, 0, 256, 256, 256);
      rg.addColorStop(0.0, 'rgba(255,225,245,1.0)');
      rg.addColorStop(0.30, 'rgba(240,180,255,0.78)');
      rg.addColorStop(0.62, 'rgba(165,120,215,0.30)');
      rg.addColorStop(1.0, 'rgba(10,8,18,0)');
      g.fillStyle = rg; g.fillRect(0, 0, 512, 512);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }
    const backdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(34, 34),
      new THREE.MeshBasicMaterial({ map: makeGlowTexture(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
    );
    backdrop.position.set(0, 0, -7);
    scene.add(backdrop);

    /* ---------- the hero diamond (round-brilliant-ish cut) ---------- */
    const diamond = new THREE.Group();

    const gemMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      emissive: new THREE.Color(0x3a1c33),   // faint internal glow so it never reads as black
      emissiveIntensity: Q.emissive,
      metalness: 0.0,
      roughness: 0.015,
      transmission: Q.transmission,  // glassy see-through (desktop only — the expensive part)
      thickness: 1.1,
      ior: 2.42,                // diamond's real index of refraction
      dispersion: Q.dispersion, // rainbow "fire" (desktop only — the expensive part)
      reflectivity: 1.0,
      specularIntensity: 1.0,
      clearcoat: Q.clearcoat,
      clearcoatRoughness: 0.06,
      iridescence: Q.iridescence,
      iridescenceIOR: 1.35,
      attenuationColor: new THREE.Color(0xfff0f8),
      attenuationDistance: 3.0,
      envMapIntensity: Q.envInt,
      flatShading: true,
      side: THREE.DoubleSide
    });

    // ---- a proper round-brilliant cut (~78 facets → real scintillation) ----
    function buildBrilliantGeometry() {
      const R = 1.0;        // girdle radius
      const rTable = 0.56;  // table radius
      const hCrown = 0.5;   // crown height above girdle
      const gThick = 0.06;  // girdle thickness
      const hPav = 1.5;     // pavilion depth
      const yTable = hCrown, yGT = 0, yGB = -gThick, yCulet = -gThick - hPav;

      const pos = [];
      const V = (x, y, z) => { pos.push(x, y, z); return pos.length / 3 - 1; };
      const ang = (k) => k * Math.PI / 8;   // 22.5° steps

      const table = [], gTop = [], gBot = [];
      for (let i = 0; i < 8; i++)  { const a = ang(2 * i); table.push(V(rTable * Math.cos(a), yTable, rTable * Math.sin(a))); }
      for (let j = 0; j < 16; j++) { const a = ang(j); gTop.push(V(R * Math.cos(a), yGT, R * Math.sin(a))); }
      for (let j = 0; j < 16; j++) { const a = ang(j); gBot.push(V(R * Math.cos(a), yGB, R * Math.sin(a))); }
      const culet = V(0, yCulet, 0);

      const idx = [];
      const tri = (a, b, c) => idx.push(a, b, c);

      // table (flat octagon on top)
      for (let i = 1; i < 7; i++) tri(table[0], table[i], table[i + 1]);
      // crown facets (bezel + star + upper-girdle) between each pair of table corners
      for (let i = 0; i < 8; i++) {
        const Ti = table[i], Tn = table[(i + 1) % 8];
        const g0 = gTop[(2 * i) % 16], g1 = gTop[(2 * i + 1) % 16], g2 = gTop[(2 * i + 2) % 16];
        tri(Ti, g0, g1); tri(Ti, g1, Tn); tri(Tn, g1, g2);
      }
      // girdle band
      for (let j = 0; j < 16; j++) {
        const a = gTop[j], b = gTop[(j + 1) % 16], c = gBot[(j + 1) % 16], d = gBot[j];
        tri(a, b, c); tri(a, c, d);
      }
      // pavilion facets down to the culet
      for (let j = 0; j < 16; j++) tri(gBot[j], gBot[(j + 1) % 16], culet);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setIndex(idx);
      geo.translate(0, 0.53, 0);   // recentre for a balanced spin
      geo.computeVertexNormals();
      return geo;
    }

    const gem = new THREE.Mesh(buildBrilliantGeometry(), gemMat);
    diamond.add(gem);
    diamond.scale.setScalar(1.15);
    diamond.rotation.x = -0.12;      // lean back a touch
    scene.add(diamond);

    // ---- twinkling sparkle glints (attached to the gem so they travel as it turns) ----
    function makeSparkleTexture() {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d'); g.translate(64, 64);
      const core = g.createRadialGradient(0, 0, 0, 0, 0, 24);
      core.addColorStop(0, 'rgba(255,255,255,1)');
      core.addColorStop(0.4, 'rgba(255,230,247,0.6)');
      core.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = core; g.beginPath(); g.arc(0, 0, 24, 0, Math.PI * 2); g.fill();
      const spike = (rot, len) => {
        g.save(); g.rotate(rot);
        const grad = g.createLinearGradient(0, 0, len, 0);
        grad.addColorStop(0, 'rgba(255,255,255,0.95)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        g.strokeStyle = grad; g.lineWidth = 2;
        g.beginPath(); g.moveTo(0, 0); g.lineTo(len, 0); g.stroke(); g.restore();
      };
      for (let k = 0; k < 4; k++) spike(k * Math.PI / 2, 58);
      for (let k = 0; k < 4; k++) spike(k * Math.PI / 2 + Math.PI / 4, 28);
      return new THREE.CanvasTexture(c);
    }
    const sparkleTex = makeSparkleTexture();
    const sparkleCols = [0xffffff, 0xffc2e6, 0xd9b3ff];
    const sparkles = [];
    for (let i = 0; i < Q.sparkles; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({
        map: sparkleTex, color: sparkleCols[i % 3], transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, opacity: 0
      }));
      const a = Math.random() * Math.PI * 2, rad = 0.95 + Math.random() * 0.5;
      s.position.set(Math.cos(a) * rad, (Math.random() - 0.4) * 1.7, Math.sin(a) * rad);
      s.userData = { phase: Math.random() * Math.PI * 2, speed: 1.4 + Math.random() * 2.6, base: 0.5 + Math.random() * 0.8 };
      diamond.add(s);
      sparkles.push(s);
    }

    /* ---------- starfield ---------- */
    const starGeo = new THREE.BufferGeometry();
    const STAR_COUNT = Q.stars;
    const sp = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT; i++) {
      const r = 16 + Math.random() * 30;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      sp[i*3]   = r * Math.sin(ph) * Math.cos(th);
      sp[i*3+1] = r * Math.cos(ph);
      sp[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
      color: 0xffdff2, size: 0.12, sizeAttenuation: true,
      transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    scene.add(stars);

    /* ---------- lights (the orbiting ones create travelling glints) ---------- */
    scene.add(new THREE.AmbientLight(0x4a3a52, 0.5));
    const key = new THREE.DirectionalLight(0xfff0f6, 0.8); key.position.set(3, 4, 5); scene.add(key);

    const glints = [];
    if (Q.lights) {
      const gA = new THREE.PointLight(0xffffff, 14, 20);
      const gB = new THREE.PointLight(0xff9ad6, 12, 20);
      const gC = new THREE.PointLight(0xc79bff, 10, 20);
      scene.add(gA, gB, gC);
      glints.push(gA, gB, gC);
    }

    /* ---------- bloom (the shine) — desktop only; too heavy for phones ---------- */
    let composer = null, bloom = null;
    if (Q.useBloom) {
      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      bloom = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        Q.bloom, 0.5, 0.85  // strength, radius, threshold (gentle glow, only true highlights)
      );
      composer.addPass(bloom);
      composer.addPass(new OutputPass());
    }

    /* ---------- interaction / timeline ---------- */
    const audio = document.getElementById('audio');
    const startEl = document.getElementById('start');
    const messageEl = document.getElementById('message');
    const replayEl = document.getElementById('replay');
    const tapLabel = document.getElementById('tapLabel');
    const tapHint = document.getElementById('tapHint');
    const browserWarn = document.getElementById('browserWarn');

    let startTime = null;
    let revealed = false;
    let replayShown = false;
    let audioReady = false;

    // In-app browsers (Telegram, Instagram, Facebook, etc.) often block audio
    // and render WebGL slowly — nudge her to open it in a real browser.
    const UA = navigator.userAgent || '';
    const inAppBrowser = /Telegram|Instagram|FBAN|FBAV|FB_IAB|Line\/|Snapchat|Pinterest|Twitter/i.test(UA);
    if (inAppBrowser) {
      browserWarn.textContent = 'For the music & smooth playback, tap the ⋯ menu and choose “Open in browser” (Chrome / Safari).';
      browserWarn.style.display = 'block';
    }

    // Preload the song and only promise "Tap to begin" once it can play through.
    function markReady() {
      if (audioReady) return;
      audioReady = true;
      tapLabel.textContent = 'Tap to begin';
      tapLabel.classList.remove('loading');
      tapHint.textContent = 'turn your sound on ♪';
    }
    audio.addEventListener('canplaythrough', markReady, { once: true });
    // Some mobile browsers don't fire canplaythrough until play() is called —
    // so fall back to enabling the tap after a short wait regardless.
    setTimeout(markReady, 5000);
    try { audio.load(); } catch (e) {}

    // If playback is ever blocked, let the next tap anywhere retry it.
    function armAudioRetry() {
      const retry = () => {
        audio.play().then(() => {
          document.removeEventListener('touchend', retry);
          document.removeEventListener('click', retry);
        }).catch(() => {});
      };
      document.addEventListener('touchend', retry, { passive: true });
      document.addEventListener('click', retry);
    }

    function begin() {
      if (startTime !== null) return;
      startEl.classList.add('hide');
      try { audio.currentTime = 0; } catch (e) {}
      const p = audio.play();
      if (p && p.catch) p.catch(() => armAudioRetry()); // visuals run regardless; retry on next tap
      startTime = performance.now();
    }
    startEl.addEventListener('click', begin);
    startEl.addEventListener('touchstart', (e) => { e.preventDefault(); begin(); }, { passive: false });

    function resetAndReplay() {
      messageEl.classList.remove('show');
      replayEl.classList.remove('show');
      revealed = false; replayShown = false;
      audio.currentTime = 0;
      audio.play().catch(() => {});
      camera.position.z = CAM_START_Z;
      startTime = performance.now();
    }
    replayEl.addEventListener('click', resetAndReplay);

    const easeInOut = (t) => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;

    // optional FPS read-out: add ?fps to the URL to see it
    const showFps = /[?&]fps/i.test(location.search);
    let fpsEl = null, fpsFrames = 0, fpsLast = performance.now();
    if (showFps) {
      fpsEl = document.createElement('div');
      fpsEl.style.cssText = 'position:fixed;top:8px;left:8px;z-index:99;font:14px monospace;color:#9effb0;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:7px';
      document.body.appendChild(fpsEl);
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const now = performance.now();

      const tt = now * 0.001;

      if (showFps) {
        fpsFrames++;
        if (now - fpsLast >= 500) {
          fpsEl.textContent = Math.round(fpsFrames * 1000 / (now - fpsLast)) + ' fps';
          fpsFrames = 0; fpsLast = now;
        }
      }

      // ambient life before she taps — spin plus a gentle wobble so more facets flash
      diamond.rotation.y += dt * 0.4;
      diamond.rotation.x = -0.12 + Math.sin(tt * 0.35) * 0.08;
      diamond.rotation.z = Math.sin(tt * 0.27) * 0.06;
      stars.rotation.y += dt * 0.01;

      // travelling glints (desktop)
      if (glints.length) {
        glints[0].position.set(Math.cos(tt*0.9)*5, Math.sin(tt*1.3)*3 + 1, Math.sin(tt*0.9)*5);
        glints[1].position.set(Math.cos(tt*0.7+2)*5, Math.sin(tt*0.9+1)*3, Math.sin(tt*0.7+2)*5);
        glints[2].position.set(Math.cos(-tt*1.1)*4.5, Math.cos(tt*0.6)*3, Math.sin(-tt*1.1)*4.5);
      }

      // twinkling sparkles
      for (const s of sparkles) {
        const u = s.userData;
        const tw = Math.max(0, Math.sin(tt * u.speed + u.phase));
        const k = tw * tw;
        s.material.opacity = k;
        s.scale.setScalar(0.04 + k * u.base);
      }

      if (startTime !== null) {
        const t = (now - startTime) / 1000;

        // camera glides in
        const p = easeInOut(Math.min(t / INTRO_DUR, 1));
        camera.position.z = CAM_START_Z + (CAM_END_Z - CAM_START_Z) * p;
        // and keeps drifting ever so slightly closer afterwards
        if (t > INTRO_DUR) camera.position.z = CAM_END_Z - Math.min((t - INTRO_DUR) * 0.02, 0.5);
        camera.lookAt(0, 0, 0);

        // the swell: message + extra shine
        if (!revealed && t >= REVEAL_AT) {
          revealed = true;
          messageEl.classList.add('show');
        }
        if (bloom) bloom.strength = revealed
          ? Math.min(Q.bloom + (t - REVEAL_AT) * 0.12, Q.bloom + 0.27)
          : Q.bloom;

        if (!replayShown && t >= REPLAY_AT) {
          replayShown = true;
          replayEl.classList.add('show');
        }
      }

      if (composer) composer.render();
      else renderer.render(scene, camera);
    }
    animate();

    /* ---------- resize ---------- */
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      if (composer) composer.setSize(w, h);
    });
  </script>
</body>
</html>
