<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06040a" />
  <title>For Farnaz ✨</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; width: 100%;
      overflow: hidden;
      background: #06040a;
      color: #fdeaf5;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    /* ---------- cosmic background ---------- */
    #sky {
      position: fixed; inset: -10%;
      background:
        radial-gradient(60% 45% at 50% 46%, rgba(120,50,110,.40) 0%, rgba(40,20,55,.25) 40%, rgba(6,4,10,0) 72%),
        radial-gradient(120% 90% at 50% 50%, #130a1e 0%, #06040a 70%);
      transform: scale(1);
      transition: transform 14s ease-out;
      z-index: 0;
    }
    #stars {
      position: fixed; top: 50%; left: 50%; width: 2px; height: 2px;
      border-radius: 50%; background: transparent; z-index: 1;
      transform-origin: center; transform: scale(1);
      transition: transform 14s ease-out, opacity 1.2s ease; opacity: .9;
    }
    .started #sky   { transform: scale(1.22); }
    .started #stars { transform: scale(1.35); }

    @keyframes twinkle { 0%,100%{opacity:.35;} 50%{opacity:1;} }

    /* ---------- the diamond ---------- */
    #stage {
      position: fixed; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      perspective: 900px;
    }
    #gemWrap {
      width: min(185vw, 760px);
      aspect-ratio: 1 / 0.92;
      position: relative; z-index: 2;
      transform: scale(.34);
      opacity: .0;
      transition: transform 11s cubic-bezier(.17,.67,.3,1), opacity 2s ease;
      filter: drop-shadow(0 0 42px rgba(255,120,205,.42)) drop-shadow(0 0 90px rgba(170,110,255,.28));
    }
    .started #gemWrap { transform: scale(1); opacity: 1; }
    #gem { width: 100%; height: 100%; display: block; overflow: visible; }

    /* travelling light shimmer, clipped to the gem silhouette */
    #sheen {
      position: absolute; inset: 0;
      clip-path: polygon(35% 22%, 65% 22%, 87.5% 40%, 50% 93.5%, 12.5% 40%);
      overflow: hidden;
      pointer-events: none;
    }
    /* one non-repeating band moved by transform: no tile seams, compositor-only */
    #sheen::before {
      content: ""; position: absolute; left: 0; top: -10%; width: 100%; height: 120%;
      background: linear-gradient(112deg,
        rgba(255,255,255,0) 36%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 64%) no-repeat;
      transform: translateX(-110%);
      will-change: transform;
      animation: sweep 4.6s linear infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-110%); }
      60%  { transform: translateX(110%); }
      100% { transform: translateX(110%); }
    }

    /* rotating ray-burst behind the gem */
    #rays {
      position: absolute; inset: 0; margin: auto;
      width: min(140vw, 760px); aspect-ratio: 1; border-radius: 50%;
      z-index: 1; pointer-events: none;
      background: repeating-conic-gradient(from 0deg,
        rgba(255,200,240,0) 0deg, rgba(255,200,240,.13) 2.2deg, rgba(255,200,240,0) 7deg);
      -webkit-mask: radial-gradient(closest-side, transparent 14%, #000 34%, transparent 78%);
              mask: radial-gradient(closest-side, transparent 14%, #000 34%, transparent 78%);
      opacity: 0; transition: opacity 2.6s ease;
      animation: spin 64s linear infinite;
    }
    .started #rays { opacity: .5; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* breathing halo right behind the gem */
    #halo {
      position: absolute; left: -16%; top: -16%; width: 132%; aspect-ratio: 1;
      border-radius: 50%; z-index: -1; pointer-events: none;
      background: radial-gradient(closest-side, rgba(255,130,210,.5), rgba(170,110,255,.2) 55%, transparent 76%);
      filter: blur(8px); animation: breathe 3.8s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100%{opacity:.55; transform:scale(.96);} 50%{opacity:.95; transform:scale(1.08);} }

    /* sparkles */
    .spark {
      position: absolute; width: 16px; height: 16px; z-index: 3;
      background:
        radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0) 72%);
      pointer-events: none; opacity: 0;
      animation: pop 3.2s ease-in-out infinite;
    }
    .spark::before, .spark::after {
      content: ""; position: absolute; inset: 0; margin: auto;
      background: linear-gradient(#fff, rgba(255,255,255,0));
    }
    .spark::before { width: 1.6px; height: 150%; top: -25%; }
    .spark::after  { height: 1.6px; width: 150%; left: -25%;
      background: linear-gradient(90deg, rgba(255,255,255,0), #fff, rgba(255,255,255,0)); }
    @keyframes pop { 0%,100%{opacity:0; transform:scale(.3);} 45%{opacity:1; transform:scale(1);} }

    /* scintillation — sharp white flashes on the facets, like a real diamond */
    .scint {
      position: absolute; width: 26px; height: 26px; z-index: 5; pointer-events: none;
      opacity: 0; transform: scale(.3);
      background: radial-gradient(closest-side, rgba(255,255,255,1), rgba(255,255,255,0) 70%);
      animation: scint 3.4s ease-in-out infinite;
    }
    .scint::before, .scint::after { content:""; position:absolute; inset:0; margin:auto; }
    .scint::before { width:1.5px; height:185%; top:-42%; background:linear-gradient(rgba(255,255,255,0), #fff, rgba(255,255,255,0)); }
    .scint::after  { height:1.5px; width:185%; left:-42%; background:linear-gradient(90deg, rgba(255,255,255,0), #fff, rgba(255,255,255,0)); }
    @keyframes scint {
      0%, 86%, 100% { opacity: 0; transform: scale(.3); }
      91%           { opacity: 1; transform: scale(1.15); }
      96%           { opacity: 0; transform: scale(.55); }
    }

    /* ---------- start screen ---------- */
    #start {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(22px, 5vh, 46px);
      background: radial-gradient(130% 90% at 50% 42%, #0e0a1a 0%, #06040a 72%);
      text-align: center; padding: 24px;
      transition: opacity 1.1s ease;
    }
    #start.hide { opacity: 0; pointer-events: none; }
    .startgem {
      width: clamp(150px, 46vw, 280px); aspect-ratio: 1/0.92; position: relative;
      animation: float 3.4s ease-in-out infinite;
      filter: drop-shadow(0 0 34px rgba(255,150,215,.6));
    }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
    .tap {
      font-family: "Playfair Display", serif; font-weight: 500;
      font-size: clamp(28px, 8vw, 46px); color: #f6ecff;
    }
    .tap.loading { opacity: .55; }
    .hint {
      font-size: clamp(15px, 4.2vw, 20px); letter-spacing: .26em; text-transform: uppercase;
      color: rgba(240,200,225,.62); animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:.95;} }
    #browserWarn {
      display: none; max-width: 330px;
      font-size: 16px; line-height: 1.5; color: #ffdcee;
      background: rgba(120,60,110,.28); border: 1px solid rgba(255,180,220,.38);
      border-radius: 14px; padding: 13px 17px;
    }

    /* ---------- message ---------- */
    #message {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; pointer-events: none; opacity: 0; padding: 24px;
      transition: opacity 2.4s ease;
      background: radial-gradient(70% 60% at 50% 50%, rgba(6,4,10,.70) 0%, rgba(6,4,10,.32) 55%, rgba(6,4,10,0) 100%);
    }
    #message.show { opacity: 1; }
    .eyebrow {
      font-weight: 500; letter-spacing: .5em; text-transform: uppercase;
      font-size: clamp(21px, 6.4vw, 38px); color: #ffd0ea; margin: 0 0 .38em .5em;
      transform: translateY(14px); opacity: 0; transition: all 1.4s ease .2s;
      text-shadow: 0 2px 6px rgba(0,0,0,.85), 0 0 18px rgba(255,140,205,.5);
    }
    .name {
      font-family: "Playfair Display", serif; font-weight: 700;
      font-size: clamp(66px, 23vw, 200px); line-height: .95; margin: 0;
      background: linear-gradient(180deg, #ffe2f3 0%, #ff8fd0 48%, #b479ff 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      -webkit-text-stroke: 1px rgba(60,20,55,.35);
      transform: translateY(22px); opacity: 0;
      transition: all 1.6s cubic-bezier(.16,1,.3,1) .5s;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,.7)) drop-shadow(0 0 28px rgba(255,130,210,.4));
    }
    .sub {
      font-style: italic; font-size: clamp(23px, 7vw, 44px); color: #fdeaf5; margin: .55em 0 0;
      transform: translateY(16px); opacity: 0; transition: all 1.5s ease 1.1s;
      text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 22px rgba(255,150,215,.35);
    }
    #message.show .eyebrow, #message.show .name, #message.show .sub { transform: translateY(0); opacity: 1; }

    /* ---------- replay ---------- */
    #replay {
      position: fixed; z-index: 25; left: 50%; bottom: clamp(34px, 9vh, 72px);
      transform: translateX(-50%); letter-spacing: .28em; text-transform: uppercase;
      font-size: clamp(16px, 4.6vw, 21px); color: #fff; font-weight: 500;
      background: rgba(210,140,255,.20); border: 1.5px solid rgba(248,185,238,.7);
      border-radius: 999px; padding: 16px 42px; cursor: pointer;
      box-shadow: 0 0 26px rgba(255,140,215,.4);
      opacity: 0; pointer-events: none; transition: opacity 1s ease, background .3s ease;
      backdrop-filter: blur(5px);
    }
    #replay.show { opacity: 1; pointer-events: auto; animation: replayPulse 2.2s ease-in-out infinite; }
    #replay:hover { background: rgba(248,185,238,.3); }
    @keyframes replayPulse {
      0%,100% { box-shadow: 0 0 20px rgba(255,140,215,.32); transform: translateX(-50%) scale(1); }
      50%     { box-shadow: 0 0 40px rgba(255,140,215,.7);  transform: translateX(-50%) scale(1.06); }
    }

    .vignette {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      box-shadow: inset 0 0 min(28vw,220px) 10px rgba(0,0,0,.72);
    }

    @media (prefers-reduced-motion: reduce) {
      #gemWrap { animation: none; }
      #sheen::before { animation-duration: 8s; }
    }
  </style>
</head>
<body>
  <div id="sky"></div>
  <div id="stars"></div>

  <div id="stage">
    <div id="rays"></div>
    <div id="gemWrap">
      <div id="halo"></div>
      <!-- faceted diamond -->
      <svg id="gem" viewBox="0 0 200 184" xmlns="http://www.w3.org/2000/svg" aria-label="diamond">
        <defs>
          <linearGradient id="gTable" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd9ef"/>
          </linearGradient>
          <linearGradient id="gLL" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe6f4"/><stop offset="1" stop-color="#ff93cf"/>
          </linearGradient>
          <linearGradient id="gLI" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0" stop-color="#ffd1ec"/><stop offset="1" stop-color="#e986c8"/>
          </linearGradient>
          <linearGradient id="gRI" x1="1" y1="0" x2="0.4" y2="1">
            <stop offset="0" stop-color="#f4d6ff"/><stop offset="1" stop-color="#c79bff"/>
          </linearGradient>
          <linearGradient id="gRR" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ead0ff"/><stop offset="1" stop-color="#a877e6"/>
          </linearGradient>
          <linearGradient id="gPavLO" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0" stop-color="#ff9ad0"/><stop offset="1" stop-color="#6f4aa8"/>
          </linearGradient>
          <linearGradient id="gPavLI" x1="0.2" y1="0" x2="0.5" y2="1">
            <stop offset="0" stop-color="#ffc4e6"/><stop offset="1" stop-color="#8457b8"/>
          </linearGradient>
          <linearGradient id="gPavRI" x1="0.8" y1="0" x2="0.5" y2="1">
            <stop offset="0" stop-color="#e7c2ff"/><stop offset="1" stop-color="#7a52b2"/>
          </linearGradient>
          <linearGradient id="gPavRO" x1="1" y1="0" x2="0.5" y2="1">
            <stop offset="0" stop-color="#c79bff"/><stop offset="1" stop-color="#5f45a0"/>
          </linearGradient>
        </defs>
        <g id="gemFacets" stroke="rgba(255,255,255,.28)" stroke-width="0.8" stroke-linejoin="round">
          <!-- table (top) -->
          <polygon points="70,40 130,40 118,56 82,56" fill="url(#gTable)"/>
          <!-- crown -->
          <polygon points="70,40 82,56 55,74 25,74" fill="url(#gLL)"/>
          <polygon points="82,56 100,56 100,74 55,74" fill="url(#gLI)"/>
          <polygon points="118,56 100,56 100,74 145,74" fill="url(#gRI)"/>
          <polygon points="130,40 118,56 145,74 175,74" fill="url(#gRR)"/>
          <!-- pavilion -->
          <polygon points="25,74 55,74 100,172" fill="url(#gPavLO)"/>
          <polygon points="55,74 100,74 100,172" fill="url(#gPavLI)"/>
          <polygon points="100,74 145,74 100,172" fill="url(#gPavRI)"/>
          <polygon points="145,74 175,74 100,172" fill="url(#gPavRO)"/>
        </g>
      </svg>
      <div id="sheen"></div>
    </div>
  </div>

  <div class="vignette"></div>

  <!-- ===== EDIT YOUR WORDS HERE ===== -->
  <div id="message">
    <p class="eyebrow">Happy Birthday</p>
    <h1 class="name">Farnaz</h1>
    <p class="sub">You're a diamond in the sky&nbsp;✨</p>
  </div>

  <div id="replay">Play again</div>

  <div id="start">
    <div class="startgem">
      <svg viewBox="0 0 200 184" width="100%" height="100%">
        <use href="#gemFacets"/>
      </svg>
    </div>
    <div class="tap loading" id="tapLabel">Loading…</div>
    <div class="hint" id="tapHint">just a moment ♪</div>
    <div id="browserWarn"></div>
  </div>

  <audio id="audio" src="Diamonds-Instrumental.m4a" preload="auto" playsinline></audio>

  <script>
    /* =========================================================
       TIMELINE (seconds from the tap). Tweak to taste / to the song.
    ========================================================= */
    const REVEAL_AT = 9.0;    // when "Happy Birthday Farnaz" fades in
    const REPLAY_AT = 13.0;   // when the "play again" button appears

    const sky = document.getElementById('sky');
    const starsEl = document.getElementById('stars');
    const gemWrap = document.getElementById('gemWrap');
    const stage = document.getElementById('stage');
    const audio = document.getElementById('audio');
    const startEl = document.getElementById('start');
    const messageEl = document.getElementById('message');
    const replayEl = document.getElementById('replay');
    const tapLabel = document.getElementById('tapLabel');
    const tapHint = document.getElementById('tapHint');
    const browserWarn = document.getElementById('browserWarn');

    /* ---------- starfield (cheap: one element, many box-shadows) ---------- */
    function buildStars() {
      const w = window.innerWidth, h = window.innerHeight;
      const n = Math.min(90, Math.round(w * h / 14000));
      const parts = [];
      for (let i = 0; i < n; i++) {
        const x = Math.round((Math.random() - 0.5) * w * 1.3);   // offsets from screen centre
        const y = Math.round((Math.random() - 0.5) * h * 1.3);
        const a = (0.35 + Math.random() * 0.6).toFixed(2);
        parts.push(`${x}px ${y}px rgba(255,${210 + (Math.random()*40|0)},245,${a})`);
      }
      starsEl.style.boxShadow = parts.join(',');
    }
    buildStars();
    window.addEventListener('resize', buildStars);

    /* ---------- sparkles around the gem ---------- */
    (function placeSparkles() {
      const spots = [[18,30],[82,26],[50,8],[30,64],[72,60],[50,88],[8,46],[92,44]];
      for (let i = 0; i < spots.length; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = spots[i][0] + '%';
        s.style.top = spots[i][1] + '%';
        s.style.animationDelay = (Math.random() * 3.2).toFixed(2) + 's';
        const sc = (0.6 + Math.random() * 0.9).toFixed(2);
        s.style.transform = `scale(${sc})`;
        gemWrap.appendChild(s);
      }
    })();

    /* ---------- scintillation: quick flashes on facet points ---------- */
    (function placeScints() {
      // facet points as % of the gem box (from the SVG facet vertices)
      const pts = [
        [35,22],[65,22],[41,30],[59,30],
        [27.5,40],[50,40],[72.5,40],[12.5,40],[87.5,40],
        [40,60],[60,60],[50,93]
      ];
      for (let i = 0; i < pts.length; i++) {
        const s = document.createElement('div');
        s.className = 'scint';
        s.style.left = `calc(${pts[i][0]}% - 13px)`;
        s.style.top = `calc(${pts[i][1]}% - 13px)`;
        s.style.animationDelay = (Math.random() * 3.4).toFixed(2) + 's';
        s.style.animationDuration = (2.8 + Math.random() * 2.2).toFixed(2) + 's';
        gemWrap.appendChild(s);
      }
    })();

    /* ---------- audio: load gate + in-app-browser warning + retry ---------- */
    let started = false, audioReady = false;
    const UA = navigator.userAgent || '';
    if (/Telegram|Instagram|FBAN|FBAV|FB_IAB|Line\/|Snapchat|Pinterest|Twitter/i.test(UA)) {
      browserWarn.textContent = 'For the music & best results, tap the ⋯ menu and choose “Open in browser” (Chrome / Safari).';
      browserWarn.style.display = 'block';
    }
    function markReady() {
      if (audioReady) return;
      audioReady = true;
      tapLabel.textContent = 'Tap to begin';
      tapLabel.classList.remove('loading');
      tapHint.textContent = 'turn your sound on ♪';
    }
    audio.addEventListener('canplaythrough', markReady, { once: true });
    setTimeout(markReady, 5000);
    try { audio.load(); } catch (e) {}

    function armAudioRetry() {
      const retry = () => {
        audio.play().then(() => {
          document.removeEventListener('touchend', retry);
          document.removeEventListener('click', retry);
        }).catch(() => {});
      };
      document.addEventListener('touchend', retry, { passive: true });
      document.addEventListener('click', retry);
    }

    let revealTimer, replayTimer;
    function begin() {
      if (started) return;
      started = true;
      startEl.classList.add('hide');
      document.body.classList.add('started');   // triggers the CSS "approach" (gem grows, stars drift)
      try { audio.currentTime = 0; } catch (e) {}
      const p = audio.play();
      if (p && p.catch) p.catch(() => armAudioRetry());
      revealTimer = setTimeout(() => messageEl.classList.add('show'), REVEAL_AT * 1000);
      replayTimer = setTimeout(() => replayEl.classList.add('show'), REPLAY_AT * 1000);
    }
    startEl.addEventListener('click', begin);
    startEl.addEventListener('touchstart', (e) => { e.preventDefault(); begin(); }, { passive: false });

    replayEl.addEventListener('click', () => {
      clearTimeout(revealTimer); clearTimeout(replayTimer);
      messageEl.classList.remove('show');
      replayEl.classList.remove('show');
      try { audio.currentTime = 0; } catch (e) {}
      audio.play().catch(() => {});
      // quick re-approach
      document.body.classList.remove('started');
      void gemWrap.offsetWidth;                  // reflow so the transition replays
      document.body.classList.add('started');
      revealTimer = setTimeout(() => messageEl.classList.add('show'), REVEAL_AT * 1000);
      replayTimer = setTimeout(() => replayEl.classList.add('show'), REPLAY_AT * 1000);
    });

    /* ---------- optional FPS meter: add ?fps to the URL ---------- */
    if (/[?&]fps/i.test(location.search)) {
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;top:8px;left:8px;z-index:99;font:14px monospace;color:#9effb0;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:7px';
      document.body.appendChild(el);
      let f = 0, last = performance.now();
      (function tick(now) {
        f++;
        if (now - last >= 500) { el.textContent = Math.round(f * 1000 / (now - last)) + ' fps'; f = 0; last = now; }
        requestAnimationFrame(tick);
      })(performance.now());
    }
  </script>
</body>
</html>
